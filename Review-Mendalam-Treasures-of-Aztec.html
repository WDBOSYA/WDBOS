<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    
    <!-- 1. Meta Refresh 0 Detik (Ekuivalen 301 Redirect Statis) -->
    <meta http-equiv="refresh" content="0; url=https://wdbosya.github.io/WDBOS/">
    
    <!-- 2. Canonical Tag (Transfer Otoritas Backlink) -->
    <link rel="canonical" href="https://wdbosya.github.io/WDBOS/">
</head>
<body>
    <!-- Fallback jika browser pengunjung memblokir Meta Refresh -->
    <p>Halaman telah dipindahkan. Jika Anda tidak diarahkan secara otomatis, <a href="https://wdbosya.github.io/WDBOS/">klik di sini</a>.</p>
    
    <!-- Fallback JavaScript (Eksekusi instan di sisi klien) -->
    <script>
        window.location.replace("https://wdbosya.github.io/WDBOS/");
    </script>
</body>
</html>
